name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Check ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg yt-dlp

      - name: Install stable Rust
        run: |
          rustup toolchain install stable \
            --profile minimal \
            --component rustfmt \
            --component clippy \
            --no-self-update
          rustup default stable

      - name: Cache Cargo data
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-ci-${{ runner.os }}-${{ runner.arch }}-stable-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-ci-${{ runner.os }}-${{ runner.arch }}-stable-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build release binaries
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --workspace --release --locked --bins --target "$TARGET"

      - name: Smoke test CLI and headless TUI
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/smoke-test-linux.py "target/$TARGET/release"

      - name: Package Linux binaries
        env:
          TARGET: ${{ matrix.target }}
        run: |
          archive_root="dloor-$TARGET"
          staging_dir="dist/$archive_root"
          mkdir -p "$staging_dir"
          install -m 0755 "target/$TARGET/release/dloor" "$staging_dir/dloor"
          install -m 0755 "target/$TARGET/release/dloor-cli" "$staging_dir/dloor-cli"
          cp README.md LICENSE "$staging_dir/"
          tar -C dist -czf "dist/$archive_root.tar.gz" "$archive_root"
          cd dist
          sha256sum "$archive_root.tar.gz" > SHA256SUMS

      - name: Upload tested Linux binaries
        uses: actions/upload-artifact@v6
        with:
          name: dloor-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
